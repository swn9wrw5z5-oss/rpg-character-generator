<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#171b2a">
<title>RPG 角色生成實驗室</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC",sans-serif;color:#f4f5fa;background:#10131e;font-size:16px}*{box-sizing:border-box}body{margin:0;padding:env(safe-area-inset-top) 14px calc(35px + env(safe-area-inset-bottom))}main{max-width:620px;margin:auto}h1{font-size:24px;margin:24px 0 5px}p{color:#b5bbcb;line-height:1.5}.sub{font-size:13px;margin:0 0 22px}.card{background:#1b2031;border:1px solid #343b50;border-radius:16px;padding:17px;margin:13px 0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;color:#b5bbcb;font-size:13px;margin-bottom:7px}select,button,input{font:inherit}select,input{width:100%;background:#111624;color:white;border:1px solid #515b76;border-radius:10px;padding:12px;min-height:45px}button{border:0;border-radius:11px;min-height:48px;padding:12px 16px;font-weight:700;cursor:pointer}button:disabled{opacity:.45}.primary{background:#8da8ff;color:#101426;width:100%;margin-top:14px}.secondary{background:#343d58;color:#f3f4fa}.yes{background:#2d785b;color:white}.no{background:#6d4053;color:white}.titleRow{display:flex;align-items:center;justify-content:space-between;gap:10px}.pill{background:#333c5b;padding:6px 12px;border-radius:30px;font-size:13px}.stat{background:#111624;border-radius:11px;padding:13px}.stat small{color:#b7c0d3;display:block}.stat strong{font-size:26px;display:block;margin-top:4px}.line{border-top:1px solid #384054;margin:15px 0}.muted{color:#b5bbcb;font-size:13px}.skill{background:#293047;border-radius:12px;padding:13px;margin:14px 0}.skill strong{display:block;margin-bottom:4px}.bar{display:flex;height:22px;border-radius:6px;overflow:hidden;margin:12px 0 7px}.bar span{display:block}.hint{font-size:12px;color:#aab3c6}.hidden{display:none}.count{display:flex;justify-content:space-between;gap:8px}.tag{font-size:13px;color:#b6c2df}#message{font-size:13px;color:#b4d9c7;margin-top:9px}footer{font-size:12px;color:#8f9bb5;margin:20px 0;text-align:center}details summary{cursor:pointer;font-weight:700}details .field{margin-top:12px}
</style>
</head>
<body><main>
<h1>🎲 RPG 角色生成實驗室</h1><p class="sub">手機獨立版 v0.2 · 玩家先選擇，GM 再揭曉</p>
<section class="card"><div class="grid"><div class="field"><label for="race">種族</label><select id="race"><option value="random">隨機種族</option><option value="barbarian">野蠻人</option><option value="elf">精靈</option><option value="human">人類</option><option value="dwarf">矮人</option></select></div><div class="field"><label for="tier">角色分級</label><select id="tier"><option value="random">隨機分級</option><option value="normal">普通</option><option value="rare">稀有</option><option value="epic">史詩</option><option value="legend">傳說</option></select></div></div><button id="generate" type="button" class="primary">🎲 生成新角色</button><div id="message" aria-live="polite"></div></section>
<section id="result" class="card hidden" aria-live="polite"><div class="titleRow"><div><h2 id="raceName" style="margin:0 0 4px;font-size:22px"></h2><div id="deviation" class="tag"></div></div><span id="tierName" class="pill"></span></div><div class="grid" style="margin-top:16px"><div class="stat"><small>生命 HP</small><strong id="hp"></strong></div><div class="stat"><small>魔力 MP</small><strong id="mp"></strong></div><div class="stat"><small>攻擊 ATK</small><strong id="atk"></strong></div><div class="stat"><small>防禦 DEF</small><strong id="def"></strong></div></div><div class="grid" style="margin-top:10px"><div class="stat"><small>背包尺寸</small><strong id="bag" style="font-size:20px"></strong></div><div class="stat"><small>操作區</small><strong id="area" style="font-size:20px"></strong></div></div><div class="skill"><strong id="skillName"></strong><span id="skillDesc" class="muted"></span></div><p style="color:white;margin-bottom:10px">你會留下這個角色嗎？</p><div class="grid"><button id="keep" type="button" class="yes">✓ 留下</button><button id="pass" type="button" class="no">✕ 放棄</button></div><p id="decisionText" class="muted"></p><button id="reveal" type="button" class="secondary" style="width:100%">👁 揭露 GM 隱藏數值</button><div id="gm" class="hidden"><div class="line"></div><div class="titleRow"><strong>GM 角色評價</strong><strong id="total" style="font-size:24px"></strong></div><div class="bar"><span id="initialBar" style="background:#73a9d8"></span><span id="skillBar" style="background:#e5b85e"></span><span id="growthBar" style="background:#9b86d1"></span></div><div class="count hint"><span id="initialLabel"></span><span id="skillLabel"></span><span id="growthLabel"></span></div><p id="gmText" class="muted"></p><p class="hint">示範版：尚未將背包尺寸與實際戰鬥效果納入完整成本模型，數值不可視為正式平衡結果。</p></div></section>
<section class="card"><div class="titleRow"><strong>本次選角紀錄</strong><span id="counts" class="muted">留下 0 · 放棄 0</span></div></section>
<section class="card"><details><summary>⚙️ GM 測試設定</summary><p class="hint">調整各分級的總價值範圍，下一次生成生效。設定儲存在這台裝置的瀏覽器中。</p><div id="settings"></div><button type="button" id="reset" class="secondary" style="margin-top:12px;width:100%">恢復示範設定</button></details></section>
<footer>本工具為離線可運作的靜態網頁；資料僅儲存於本機瀏覽器。</footer>
</main>
<script>
'use strict';
(function(){
const defaults={normal:[85,115],rare:[115,145],epic:[140,175],legend:[160,200]};
const tierNames={normal:'普通',rare:'稀有',epic:'史詩',legend:'傳說'};
const raceData={barbarian:{name:'野蠻人',weights:[4,1,4,2],bag:[7,9],area:'3×2'},elf:{name:'精靈',weights:[2,5,2,2],bag:[6,8],area:'3×3'},human:{name:'人類',weights:[3,3,3,3],bag:[6,8],area:'3×3'},dwarf:{name:'矮人',weights:[4,2,3,5],bag:[6,8],area:'3×2'}};
const skills=[{name:'堅韌',desc:'受到物理傷害時減傷',cost:20},{name:'魔力親和',desc:'施法 MP 消耗降低',cost:25},{name:'戰鬥直覺',desc:'攻擊時有機率追加傷害',cost:30},{name:'收納專家',desc:'背包整理與攜帶效率提高',cost:35},{name:'再生',desc:'回合結束時少量恢復 HP',cost:40}];
const $=id=>document.getElementById(id);const pick=a=>a[Math.floor(Math.random()*a.length)];const roll=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
let ranges=JSON.parse(JSON.stringify(defaults));try{const saved=JSON.parse(localStorage.getItem('rpgRanges'));if(saved&&Object.keys(defaults).every(k=>Array.isArray(saved[k])&&saved[k].length===2))ranges=saved;}catch(e){}
let hero=null,decision='',kept=0,passed=0;
function buildSettings(){const box=$('settings');box.replaceChildren();Object.keys(defaults).forEach(key=>{const row=document.createElement('div');row.className='field';row.innerHTML='<label>'+tierNames[key]+'：總分下限／上限</label><div class="grid"><input type="number" min="40" max="1000" id="min-'+key+'"><input type="number" min="40" max="1000" id="max-'+key+'"></div>';box.appendChild(row);$('min-'+key).value=ranges[key][0];$('max-'+key).value=ranges[key][1];['min','max'].forEach(prefix=>$(prefix+'-'+key).addEventListener('change',()=>{const min=Number($('min-'+key).value),max=Number($('max-'+key).value);if(Number.isInteger(min)&&Number.isInteger(max)&&min>=40&&max>=min&&max<=1000){ranges[key]=[min,max];try{localStorage.setItem('rpgRanges',JSON.stringify(ranges));}catch(e){}$('message').textContent='已儲存 '+tierNames[key]+' 分級設定';}else{$('message').textContent='設定無效：下限需至少 40，且上限不得小於下限';$('min-'+key).value=ranges[key][0];$('max-'+key).value=ranges[key][1];}}));});}
function generate(){const raceId=$('race').value==='random'?pick(Object.keys(raceData)):$('race').value;let tierId=$('tier').value;if(tierId==='random'){const p=Math.random();tierId=p<.6?'normal':p<.85?'rare':p<.96?'epic':'legend';}const r=raceData[raceId];const range=ranges[tierId];const total=roll(range[0],range[1]);const deviation=Math.random()<.2;const weights=r.weights.map(w=>deviation?0.5+Math.random()*5:w*(.65+Math.random()*.7));const sum=weights.reduce((a,b)=>a+b,0);const shares=weights.map(w=>w/sum);const eligible=skills.filter(s=>s.cost<=total*.7);const skill=pick(eligible.length?eligible:skills);const remaining=total-skill.cost;const growth=Math.round(remaining*(.1+Math.random()*.7));const initial=remaining-growth;const bagW=roll(r.bag[0],r.bag[1]);const bagH=Math.max(5,bagW-(Math.random()<.5?1:0));hero={raceId,tierId,total,deviation,skill,growth,initial,bag:bagW+'×'+bagH,area:r.area,hp:Math.round(35+initial*shares[0]*1.8),mp:Math.round(10+initial*shares[1]*1.8),atk:Math.round(3+initial*shares[2]*.6),def:Math.round(2+initial*shares[3]*.5)};decision='';$('raceName').textContent=r.name;$('tierName').textContent=tierNames[tierId];$('deviation').textContent=deviation?'非典型能力傾向':'一般種族傾向';['hp','mp','atk','def','bag','area'].forEach(k=>$(k).textContent=hero[k]);$('skillName').textContent=skill.name;$('skillDesc').textContent=skill.desc;$('result').classList.remove('hidden');$('gm').classList.add('hidden');$('reveal').textContent='👁 揭露 GM 隱藏數值';$('decisionText').textContent='';$('keep').disabled=false;$('pass').disabled=false;$('message').textContent='已生成新角色';}
function decide(value){if(!hero||decision)return;decision=value;if(value==='keep')kept++;else passed++;$('counts').textContent='留下 '+kept+' · 放棄 '+passed;$('decisionText').textContent=value==='keep'?'你選擇留下這個角色。':'你選擇放棄這個角色。';$('keep').disabled=true;$('pass').disabled=true;}
function reveal(){if(!hero)return;const gm=$('gm');if(!gm.classList.contains('hidden')){gm.classList.add('hidden');$('reveal').textContent='👁 揭露 GM 隱藏數值';return;}$('total').textContent=hero.total+' 分';[['initial',hero.initial],['skill',hero.skill.cost],['growth',hero.growth]].forEach(([name,value])=>{$(name+'Bar').style.width=(value/hero.total*100)+'%';$(name+'Label').textContent=({initial:'初始',skill:'技能',growth:'成長'})[name]+' '+value;});$('gmText').textContent='隱藏成長預算：'+hero.growth+' 分 · 異類傾向：'+(hero.deviation?'是':'否')+' · 分級區間：'+ranges[hero.tierId].join('～');gm.classList.remove('hidden');$('reveal').textContent='隱藏 GM 數值';}
$('generate').addEventListener('click',generate);$('keep').addEventListener('click',()=>decide('keep'));$('pass').addEventListener('click',()=>decide('pass'));$('reveal').addEventListener('click',reveal);$('reset').addEventListener('click',()=>{ranges=JSON.parse(JSON.stringify(defaults));try{localStorage.removeItem('rpgRanges');}catch(e){}buildSettings();$('message').textContent='已恢復示範設定';});buildSettings();
})();
</script>
</body></html>

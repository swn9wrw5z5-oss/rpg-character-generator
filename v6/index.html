<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111b22"><title>角色生成器 V6｜首技免費</title><link rel="stylesheet" href="./web/style.css?v=ui-restore-20261124"></head><body><main><header><div><h1>角色生成 V6</h1><small>出生容量 · 首技免費</small></div><button id="settings-open">設定</button></header><p id="error" role="alert"></p><section id="hero"><div id="portrait-frame" class="species-portrait"><img id="portrait" alt="角色頭像"></div><div><h2 id="species-name">載入中</h2><p><span id="rarity"></span> <span id="mutation"></span></p><small id="character-id"></small></div></section><section class="panel"><div class="section-title"><h3>四項素質與成長</h3><button id="allocation-open">配點</button></div><div id="attributes"></div></section><section class="panel"><div class="section-title"><h3>出生技能</h3><span id="skill-count"></span></div><div id="skills"></div></section><section class="panel"><div class="section-title"><h3>背包容量</h3><span id="bag-label"></span></div><div id="board"></div><p id="bag-note"></p></section><button id="generate" class="primary" disabled>生成角色</button><footer><a href="../attributes/index.html">保留的 attributes 版本</a></footer></main><dialog id="settings"><div class="dialog-head"><h2>測試設定</h2><button data-close>關閉</button></div><div class="dialog-body">
<label>Seed<input id="seed" value="v6-excel-review" aria-label="Seed"></label>
<label>種族<select id="species" aria-label="指定種族"><option value="">全部隨機</option></select></label>
<button id="repeat">以此 Seed 從第 1 名重新生成</button>
<p id="settings-status" class="status" role="status"></p>
<section class="settings-group" id="settings-batch"><h3>批次測試</h3><select id="batch-count" aria-label="批次數量"><option value="100">100 名</option><option value="1000">1,000 名</option><option value="10000">10,000 名</option><option value="100000">100,000 名</option></select><button id="batch">固定 Seed 批次模擬</button><pre id="batch-result"></pre></section>
<section class="settings-group" id="settings-version"><h3>設定版本</h3><p>線上版使用目前發布的參數。Excel 調整可在電腦本機版測試。</p><button id="export-settings">匯出目前設定 JSON</button><button id="restore">回復已發布設定</button></section>
<section class="settings-group" id="settings-character"><button id="export">匯出新版角色 JSON</button></section>
<details id="settings-developer"><summary>開發者資料、警告與暫定公式</summary><pre id="import-report"></pre><pre id="debug"></pre></details>
</div></dialog><dialog id="allocation"><div class="dialog-title"><h2>自由配點</h2><button data-close>關閉</button></div><label>角色等級<input id="level" type="number" min="1" value="1"></label><p id="points"></p><div id="allocation-inputs"></div><button id="reset">重設配點</button><pre id="combat"></pre></dialog><dialog id="skill-detail"><div class="dialog-title"><h2 id="skill-title"></h2><button data-close>關閉</button></div><p id="skill-description"></p><p>技能效果僅示意，尚未實作戰鬥效果。</p></dialog><script type="module" src="./web/app.mjs?v=ui-restore-20261124"></script></body></html>

<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111b22"><title>角色生成器 V6｜首技免費</title><link rel="stylesheet" href="./web/style.css"></head><body><main><header><div><h1>角色生成 V6</h1><small>出生容量 · 首技免費</small></div><button id="settings-open">設定</button></header><p id="error" role="alert"></p><section id="hero"><img id="portrait" alt="角色頭像"><div><h2 id="species-name">載入中</h2><p><span id="rarity"></span> <span id="mutation"></span></p><small id="character-id"></small></div></section><section class="panel"><div class="section-title"><h3>四項素質與成長</h3><button id="allocation-open">配點</button></div><div id="attributes"></div></section><section class="panel"><div class="section-title"><h3>出生技能</h3><span id="skill-count"></span></div><div id="skills"></div></section><section class="panel"><div class="section-title"><h3>背包容量</h3><span id="bag-label"></span></div><div id="board"></div><p id="bag-note"></p></section><button id="generate" class="primary" disabled>生成角色</button><footer><a href="../attributes/index.html">保留的 attributes 版本</a></footer></main><dialog id="settings"><div class="dialog-title"><h2>測試設定</h2><button data-close>關閉</button></div><label>固定 Seed<input id="seed" value="v6-excel-review"></label><label>種族<select id="species"><option value="">全部隨機</option></select></label><button id="repeat">以此設定重現首名</button><p>線上版使用已發布設定；Excel 調整與重新匯入請使用本機測試版。</p><button id="restore">回復已發布設定</button><button id="export">匯出角色 JSON</button><button id="batch">固定 Seed 批次 1,000 名</button><pre id="batch-result"></pre><details><summary>版本與暫定參數</summary><pre id="import-report"></pre></details><details><summary>完整計算明細</summary><pre id="debug"></pre></details></dialog><dialog id="allocation"><div class="dialog-title"><h2>自由配點</h2><button data-close>關閉</button></div><label>角色等級<input id="level" type="number" min="1" value="1"></label><p id="points"></p><div id="allocation-inputs"></div><button id="reset">重設配點</button><pre id="combat"></pre></dialog><dialog id="skill-detail"><div class="dialog-title"><h2 id="skill-title"></h2><button data-close>關閉</button></div><p id="skill-description"></p><p>技能效果僅示意，尚未實作戰鬥效果。</p></dialog><script type="module" src="./web/app.mjs"></script></body></html>
